project_id = "atlas-gestao"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
enabled = true
site_url = "https://atlas-gestao-xi.vercel.app"
additional_redirect_urls = ["https://atlas-gestao-xi.vercel.app/**", "http://127.0.0.1:3000/**", "http://localhost:3000/**"]
enable_signup = false
jwt_expiry = 3600

[auth.email]
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "10MiB"
